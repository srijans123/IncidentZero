  <text x="500" y="83" fill="#A499D4" font-family="'Courier New', monospace" font-size="13">backend/src/main/resources/db/migration/V003__audit_timers_ai.sql (L18–L23)</text>

  <!-- Language Badge -->
  <rect x="1690" y="63" width="90" height="24" fill="#FFD84D" stroke="#0B071E" stroke-width="2"/>
  <text x="1735" y="80" fill="#0B071E" font-family="'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle">SQL</text>

  <!-- Gutter Separator -->
  <line x1="155" y1="100" x2="155" y2="560" stroke="#2E236C" stroke-width="2"/>

  <!-- Code Lines -->
  
    <!-- Line 18 -->
    <text x="135" y="135" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">18</text>
    <text x="175" y="135" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">CREATE OR REPLACE FUNCTION audit_immutable() RETURNS trigger AS $$</text>

    <!-- Line 19 -->
    <text x="135" y="159" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">19</text>
    <text x="175" y="159" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">BEGIN RAISE EXCEPTION &#x27;audit_record is append-only&#x27;; END;</text>

    <!-- Line 20 -->
    <text x="135" y="183" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">20</text>
    <text x="175" y="183" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">$$ LANGUAGE plpgsql;</text>

    <!-- Line 21 -->
    <text x="135" y="207" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">21</text>
    <text x="175" y="207" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14"></text>

    <!-- Line 22 -->
    <text x="135" y="231" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">22</text>
    <text x="175" y="231" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">CREATE TRIGGER audit_no_change BEFORE <tspan fill="#FFD84D" font-weight="bold">UPDATE</tspan> OR <tspan fill="#FFD84D" font-weight="bold">DELETE</tspan> OR TRUNCATE ON audit_record</text>

    <!-- Line 23 -->
    <text x="135" y="255" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">23</text>
    <text x="175" y="255" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">  FOR EACH STATEMENT EXECUTE FUNCTION audit_immutable();</text>

