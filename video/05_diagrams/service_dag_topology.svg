  <text x="96" y="898" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#FFFFFF">• Cycle Rejection Guard: Any dependency edge addition (u → v) creating an SCC of size &gt; 1 throws CycleDetectedException.</text>
