  <text x="96" y="974" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="900" fill="#7CE356">• Verification endpoint (/api/v1/audit/verify) scans the chain in O(N) and pinpoints the exact corrupted block index.</text>
