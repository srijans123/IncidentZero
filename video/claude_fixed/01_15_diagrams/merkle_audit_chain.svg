  <text x="96" y="902" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">• If an adversary alters any byte of historical SQL data (e.g. modifying timestamp, actor, or resolution code),</text>
