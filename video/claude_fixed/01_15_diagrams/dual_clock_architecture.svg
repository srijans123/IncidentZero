  <text x="120" y="624" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Provides strictly monotonic immutable timestamps for every SHA-256 Merkle</text>
  <text x="120" y="650" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">audit block and JWT expiry check.</text>
