  <text x="120" y="380" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="900" fill="#FFD84D">INPUT: ClockPort.now() (Pure Instant)</text>
  <text x="120" y="418" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Never pauses. Ticks continuously 24/7/365 across all states without</text>
