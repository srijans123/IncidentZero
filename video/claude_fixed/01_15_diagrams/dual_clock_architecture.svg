  <text x="1045" y="624" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Timer freezes completely upon entering WAITING_FOR_CLIENT. Zero SLA penalty</text>
  <text x="1045" y="650" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">while awaiting reporter confirmation.</text>
