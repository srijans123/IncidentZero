  <text x="120" y="830" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">If total physical wall time exceeds 72 hours, triggers executive campus</text>
  <text x="120" y="856" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">escalation even if ticket was paused in WAITING_FOR_CLIENT.</text>
