<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" shape-rendering="crispEdges" text-rendering="geometricPrecision">
  <defs>
    <!-- 24x24 16-Bit Pixel Checkerboard Dither Pattern (IncidentZero Signature Canvas) -->
    <pattern id="pixelChecker" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#1E1646"/>
      <rect x="0" y="0" width="24" height="24" fill="#261C58"/>
      <rect x="24" y="24" width="24" height="24" fill="#261C58"/>
    </pattern>
    <!-- Subtle Pixel Grid Overlay -->
    <pattern id="pixelGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#32266E" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <!-- CRT Scanline Overlay Pattern -->
    <pattern id="crtScanlines" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="2" fill="#0B071E" fill-opacity="0.18"/>
      <rect x="0" y="2" width="8" height="2" fill="none"/>
    </pattern>
  </defs>

