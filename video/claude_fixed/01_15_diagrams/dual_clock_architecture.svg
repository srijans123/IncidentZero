  <text x="1045" y="418" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Nights, weekends, campus holidays, and academic recesses are</text>
  <text x="1045" y="444" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">deterministically subtracted via BusinessCalendar.</text>
