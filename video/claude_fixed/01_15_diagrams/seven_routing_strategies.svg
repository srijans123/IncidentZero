  <text x="84" y="265" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">Cycles deterministically across active technicians via</text>
  <text x="84" y="290" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">atomic modulo counter. Guarantees equal shift</text>
