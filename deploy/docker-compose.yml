services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: iitsm
      POSTGRES_USER: itsm_owner
      POSTGRES_PASSWORD: itsm_owner_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm_owner -d iitsm"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/iitsm
      DB_OWNER_USER: itsm_owner
      DB_OWNER_PASSWORD: itsm_owner_password
      DB_APP_USER: itsm_app
      DB_APP_PASSWORD: itsm_dev_password
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AI_PROVIDER: ${AI_PROVIDER:-replay}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
