name: Deploy Incident-Zero to GitHub Pages

# The site is served from the gh-pages branch (Settings → Pages → "Deploy from a branch").
# Every push to main rebuilds the frontend and force-pushes the result to that branch.
on:
  push:
    branches: ["main"]
    paths: ["frontend/**", "landing.html", "scripts/deploy-pages.mjs", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build and publish to gh-pages
        env:
          PAGES_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: node scripts/deploy-pages.mjs
