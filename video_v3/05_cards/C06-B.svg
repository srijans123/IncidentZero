    <text x="175" y="423" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">      <tspan fill="#FFD84D" font-weight="bold">case</tspan> ACKNOWLEDGE, START_INVESTIGATION, REQUEST_USER_INFO, RESOLVE -&gt; isAssignee;</text>

    <!-- Line 24 -->
