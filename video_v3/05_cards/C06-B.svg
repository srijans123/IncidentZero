    <text x="175" y="447" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">      <tspan fill="#FFD84D" font-weight="bold">case</tspan> PROVIDE_USER_INFO, VERIFY, REJECT_RESOLUTION -&gt; isReporter;</text>

    <!-- Line 25 -->
    <text x="135" y="471" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">25</text>
    <text x="175" y="471" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">      <tspan fill="#FFD84D" font-weight="bold">case</tspan> CANCEL -&gt; isReporter || isAdmin;</text>

    <!-- Line 26 -->
    <text x="135" y="495" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">26</text>
    <text x="175" y="495" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">      <tspan fill="#FFD84D" font-weight="bold">case</tspan> RESOLVE_WITH_MASTER -&gt; false; // SYSTEM only</text>

    <!-- Line 27 -->
    <text x="135" y="519" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">27</text>
    <text x="175" y="519" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    };</text>

    <!-- Line 28 -->
    <text x="135" y="543" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">28</text>
    <text x="175" y="543" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    <tspan fill="#FFD84D" font-weight="bold">if</tspan> (!allowed) {</text>

    <!-- Line 29 -->
