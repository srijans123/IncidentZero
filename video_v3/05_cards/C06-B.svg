    <text x="175" y="567" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">      <tspan fill="#FFD84D" font-weight="bold">throw</tspan> <tspan fill="#FFD84D" font-weight="bold">new</tspan> UnauthorizedOperationException(actorId, cmd.name());</text>

    <!-- Line 30 -->
    <text x="135" y="591" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">30</text>
