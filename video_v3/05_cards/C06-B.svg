    <!-- Line 11 -->
    <text x="135" y="135" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">11</text>
    <text x="175" y="135" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">  <tspan fill="#FFD84D" font-weight="bold">public</tspan> <tspan fill="#FFD84D" font-weight="bold">void</tspan> authorize(Incident inc, CommandType cmd, UUID actorId, String role, String supportTier) {</text>

