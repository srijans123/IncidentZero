    <text x="175" y="159" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    <tspan fill="#FFD84D" font-weight="bold">if</tspan> (Actors.SYSTEM.equals(actorId)) <tspan fill="#FFD84D" font-weight="bold">return;</tspan></text>

    <!-- Line 13 -->
    <text x="135" y="183" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">13</text>
    <text x="175" y="183" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    boolean isAdmin = &quot;ADMINISTRATOR&quot;.equals(role);</text>

    <!-- Line 14 -->
    <text x="135" y="207" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">14</text>
    <text x="175" y="207" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    boolean isTeamLead = &quot;TECHNICIAN&quot;.equals(role) &amp;&amp; &quot;TEAM_LEAD&quot;.equals(supportTier);</text>

    <!-- Line 15 -->
    <text x="135" y="231" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">15</text>
    <text x="175" y="231" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    boolean isTech = &quot;TECHNICIAN&quot;.equals(role);</text>

    <!-- Line 16 -->
    <text x="135" y="255" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">16</text>
    <text x="175" y="255" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    boolean isReporter = inc.reporterId().equals(actorId);</text>

    <!-- Line 17 -->
    <text x="135" y="279" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">17</text>
    <text x="175" y="279" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    boolean isAssignee = inc.assigneeId() != null &amp;&amp; inc.assigneeId().equals(actorId);</text>

    <!-- Line 18 -->
    <text x="135" y="303" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">18</text>
    <text x="175" y="303" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14"></text>

    <!-- Line 19 -->
