    <text x="175" y="327" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">    boolean allowed = <tspan fill="#FFD84D" font-weight="bold">switch</tspan> (cmd) {</text>

    <!-- Line 20 -->
    <text x="135" y="351" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">20</text>
    <text x="175" y="351" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">      <tspan fill="#FFD84D" font-weight="bold">case</tspan> CLASSIFY, CLOSE, LINK_AS_CHILD, UNLINK_FROM_MASTER, REPRIORITIZE -&gt; isTech || isAdmin || (cmd == CommandType.UNLINK_FROM_MASTER &amp;&amp; isReporter);</text>

    <!-- Line 21 -->
    <text x="135" y="375" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">21</text>
    <text x="175" y="375" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">      <tspan fill="#FFD84D" font-weight="bold">case</tspan> ASSIGN, DECLARE_MAJOR -&gt; isTeamLead || isAdmin;</text>

    <!-- Line 22 -->
    <text x="135" y="399" fill="#7B739E" font-family="'Courier New', monospace" font-size="14" text-anchor="end">22</text>
    <text x="175" y="399" fill="#FFF8DC" font-family="'Courier New', monospace" font-size="14">      <tspan fill="#FFD84D" font-weight="bold">case</tspan> REASSIGN -&gt; isTeamLead || isAdmin || isAssignee;</text>

    <!-- Line 23 -->
